<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login {
            width: 360px;
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0,0,0,.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Admin Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
